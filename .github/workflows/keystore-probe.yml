name: Keystore Probe
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect original keystore secret
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -x
          printf '%s' "$KS" | base64 -d > /tmp/ks.p12 2>/dev/null || echo "DECODE FAILED"
          ls -la /tmp/ks.p12
          keytool -list -v -keystore /tmp/ks.p12 -storepass "$PASS" 2>&1 | grep -E "Keystore type|Alias name|SHA1:|password" | head -6
